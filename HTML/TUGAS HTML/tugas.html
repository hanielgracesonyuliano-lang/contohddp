<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

<body>
    <div class="kotak">
        <h2>Form Pendaftaran Akun</h2>
            <label>Nama Lengkap:</label><br>
            <input type="text" name="nama" required><br><br>
           
            <label>NIM:</label><br>
            <input type="number" name="nim" required><br><br>

            <label> Password:</label><br>
            <input type="password" name="password" required><br><br>

            <label> Tanggal Lahir:</label><br>
            <input type="date" name="tanggal_lahir" required><br><br>

            <label> Jenis Kelamin:</label><br>
            <input type="radio" name="jenis_kelamin" value="Laki-laki" required> Laki-laki
            <input type="radio" name="jenis_kelamin" value="Perempuan" required> Perempuan<br><br>

            <label> Program Studi:</label><br>
            <select name="pilihan" required>
                <option value="Teknik Informatika">Teknik Informatika</option>
                <option value="Desain Komunikasi Visual">Desain Komunikasi Visual</option>
                <option value="Sistem Informasi">Sistem Informasi</option>
            </select>
            <br><br>

            <label> Fakultas: </label><br>
            <select name="role" required>
                <option value="Fakultas Teknologi Informasi">Fakultas Teknologi Informasi</option>
                <option value="Fakultas Ekonomika dan Bisnis">Fakultas Ekonomika dan Bisnis</option>
                <option value="Fakultas Keguruan dan Ilmu Pendidikan">Fakultas Keguruan dan Ilmu Pendidikan</option>
            </select>
            <br><br>
        
            <a href="2ndt.html"><button>Daftar Sekarang</button></a>
    </div>
